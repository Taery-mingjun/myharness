[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myharness"
version = "0.2.0"
description = "MyHarness - Cognitive Operating System for AI Agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Taerymingjun"},
]
keywords = ["ai", "agent", "cognitive", "llm", "memory", "skill"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Data Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Async
    "httpx>=0.27.0",
    "aiofiles>=24.0.0",

    # Database & Storage
    "aiosqlite>=0.20.0",

    # Vector Search
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",

    # LLM Providers
    "openai>=1.50.0",
    "anthropic>=0.34.0",
    "google-generativeai>=0.8.0",

    # Execution Driver: MCP (Model Context Protocol) client — protocol 14.4
    "mcp>=2.0.0",

    # Dependency Injection
    "lagom>=2.0.0",

    # Prompt Templates
    "jinja2>=3.1.0",

    # Observability
    "structlog>=24.0.0",

    # Graph
    "networkx>=3.3.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

browser = [
    "playwright>=1.45.0",
]

all = [
    "myharness[dev,browser]",
]

[project.scripts]
myharness = "myharness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myharness"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/myharness --cov-report=term-missing"
